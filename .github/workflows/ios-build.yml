name: ios-build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project EquilProbe.xcodeproj \
            -target EquilProbe \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/EquilProbe.app Payload/
          zip -qry EquilProbe-unsigned.ipa Payload
          ls -lh EquilProbe-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EquilProbe-unsigned-ipa
          path: EquilProbe-unsigned.ipa
          retention-days: 30
