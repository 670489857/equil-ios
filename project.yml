name: EquilController
options:
  bundleIdPrefix: app.equil
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "3.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  EquilController:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 科研泵3.1
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBluetoothAlwaysUsageDescription: "用于连接并控制 Equil 贴敷式胰岛素泵。"
        NSBluetoothPeripheralUsageDescription: "用于连接并控制 Equil 贴敷式胰岛素泵。"
        NSLocalNetworkUsageDescription: "内置日志服务器，供开发者在局域网内读取运行日志。"
        NSBonjourServices:
          - "_http._tcp"
        UIBackgroundModes:
          - bluetooth-central
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.equil.probe
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
