name: ios-build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-latest
    env:
      BASE_VERSION: "3.1"
      APP_NAME: "科研泵3.1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute build number
        id: ver
        run: |
          BUILD=$(git rev-list --count HEAD)
          [ -z "$BUILD" ] && BUILD=${{ github.run_number }}
          echo "BUILD=$BUILD" >> $GITHUB_OUTPUT
          echo "VERSION=${BASE_VERSION}.${BUILD}" >> $GITHUB_OUTPUT
          echo "build=$BUILD version=${BASE_VERSION}.${BUILD}"

      - name: Inject version
        run: |
          python3 - "${{ steps.ver.outputs.VERSION }}" "${{ steps.ver.outputs.BUILD }}" <<'PY'
          import re, sys
          version, build = sys.argv[1], sys.argv[2]
          s = open('project.yml').read()
          s = re.sub(r'MARKETING_VERSION: ".*"', f'MARKETING_VERSION: "{version}"', s)
          s = re.sub(r'CURRENT_PROJECT_VERSION: ".*"', f'CURRENT_PROJECT_VERSION: "{build}"', s)
          open('project.yml', 'w').write(s)
          print([l.strip() for l in s.splitlines() if 'VERSION' in l])
          PY

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project EquilController.xcodeproj \
            -target EquilController \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/EquilController.app Payload/
          IPA="${APP_NAME}-v${{ steps.ver.outputs.VERSION }}-未签名.ipa"
          zip -qry "$IPA" Payload
          echo "IPA_NAME=$IPA" >> $GITHUB_ENV
          ls -lh "$IPA"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" -c "Print :CFBundleShortVersionString" -c "Print :CFBundleVersion" Payload/EquilController.app/Info.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: research-pump-v${{ steps.ver.outputs.VERSION }}
          path: ${{ env.IPA_NAME }}
          retention-days: 30
